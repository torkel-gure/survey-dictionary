<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survey Dictionary</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='9' width='3' height='6' rx='1' fill='%232a78d6'/><rect x='6.5' y='4' width='3' height='11' rx='1' fill='%232a78d6'/><rect x='12' y='1' width='3' height='14' rx='1' fill='%232a78d6'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Survey Dictionary</h1>
    <p class="sub" id="stats">Loading…</p>
  </div>
  <nav class="tabs" aria-label="Views">
    <a href="#" id="tabSearch">Search all questions</a>
    <a href="#v=programmes" id="tabProgs">Survey programmes</a>
  </nav>
  <div class="context" id="context" hidden></div>
  <div class="controls" id="controls">
    <label class="field search">
      <span id="qLabel">Search</span>
      <input id="q" type="search" placeholder="Question wording or variable name, e.g. trust parliament" autocomplete="off" autofocus>
    </label>
    <form class="filters" id="filters">
      <div class="field" id="progField">
        <span>Filter: survey programmes</span>
        <div class="msel">
          <button type="button" id="progBtn" class="msel-btn" aria-haspopup="true" aria-expanded="false">All programmes</button>
          <div class="msel-pop" id="progPop" hidden>
            <div class="msel-actions">
              <span class="muted">Tick one or more</span>
              <button type="button" class="btn small" data-msel="none">Clear</button>
              <button type="button" class="btn small" data-msel="all">Select all</button>
            </div>
            <ul id="progList" role="listbox" aria-multiselectable="true"></ul>
          </div>
        </div>
      </div>
      <label class="field">
        <span>Sort results by</span>
        <select id="sort">
          <option value="rel">Best match</option>
          <option value="n">Most datasets</option>
          <option value="nc">Most countries</option>
        </select>
      </label>
      <button id="apply" type="submit" class="btn primary" disabled>Apply filter</button>
    </form>
  </div>
  <div class="active" id="active" aria-live="polite"></div>
</header>

<main class="layout" id="layout">
  <section class="results" aria-label="Search results">
    <div class="results-head" id="resultsHead"></div>
    <ol id="results"></ol>
    <div class="results-foot">
      <button id="more" class="btn" hidden>Show more</button>
      <p id="allShown" class="muted" hidden></p>
    </div>
  </section>
  <section class="detail" id="detail" aria-live="polite"></section>
</main>

<main class="prog-index" id="progIndex" hidden></main>

<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
